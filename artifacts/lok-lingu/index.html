<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lok Lingu — Infinite Language Arcade</title>
    <meta name="description" content="An infinite voice-controlled language arcade runner. Speak words, shatter them, climb the leaderboard." />
    <meta name="theme-color" content="#00e5ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lok Lingu" />
    <!--
      iOS "Add to Home Screen" does NOT read manifest.json icons — it looks
      only for apple-touch-icon, and falls back to a plain color tile with
      the page's first letter when it's missing. That fallback tile (a flat
      teal square with "L") is exactly what was showing up; this link is the
      actual fix, not a nice-to-have alongside the manifest icons below.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Open Graph -->
    <meta property="og:title" content="Lok Lingu — Infinite Language Arcade" />
    <meta property="og:description" content="Voice-controlled language learning. Speak words. Shatter them. Count infinitely." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
